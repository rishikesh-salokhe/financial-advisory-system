# Pre-commit hooks: run automatically before every `git commit`.
#
# First-time setup on a fresh clone:
#     pip install pre-commit detect-secrets
#     pre-commit install
#     detect-secrets scan > .secrets.baseline   # only if .secrets.baseline is missing
#
# Manual one-shot scan over the whole repo (CI-friendly):
#     pre-commit run --all-files
#
# Hook versions are pinned to specific tags for reproducibility. Run
# ``pre-commit autoupdate`` to bump them.

repos:
  # ── Secret detection (the primary reason this file exists) ─────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Scan for accidentally committed secrets
        args: ['--baseline', '.secrets.baseline']
        # Skip binary / generated content so the scanner stays fast.
        exclude: |
          (?x)^(
              .*\.lock|
              .*\.ipynb|
              .*\.parquet|
              data/vectorstore/.*|
              models/.*
          )$

  # ── Lightweight general hygiene (cheap to run, no dependencies) ────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Streamlit's pages/ have non-YAML files but no .yml/.yaml in there
        # currently — this hook only scans matching extensions anyway.
      - id: check-added-large-files
        args: ['--maxkb=5000']   # 5 MB cap; raise if you ever check in real data
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
