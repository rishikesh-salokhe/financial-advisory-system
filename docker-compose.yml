services:
  mongo:
    image: mongo:7
    container_name: fa_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: financial_advisory

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: fa_backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app/backend
      - ./ml_engine:/app/ml_engine
      - ./data:/app/data
      - ./models:/app/models
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: fa_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app/dashboard
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  mongo_data:
